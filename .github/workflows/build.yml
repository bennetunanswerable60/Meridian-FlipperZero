name: Build FAP

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # A detector nobody has tried to fool is a decoration, and a screenshot
  # cannot vouch for a threshold. The parser and the engine get run against
  # synthesised attacks - and against honest skies, which is the half that
  # actually matters - on every push.
  test:
    runs-on: ubuntu-latest
    name: parser + engine
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: make -C test

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [release, dev]
    name: ufbt (${{ matrix.channel }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ufbt
        run: python3 -m pip install --upgrade ufbt

      - name: Sync SDK (${{ matrix.channel }})
        run: ufbt update --channel=${{ matrix.channel }}

      - name: Build Meridian
        run: ufbt

      - name: Upload .fap
        uses: actions/upload-artifact@v4
        with:
          name: meridian-fap-${{ matrix.channel }}
          path: dist/*.fap
          if-no-files-found: error
